<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2分ワークアウト</title>
<meta name="theme-color" content="#101318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2分ワークアウト">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0d1014;--card:#1a1f27;--line:#2a313c;--text:#eef2f6;--sub:#9aa6b4;--work:#4fd1e8;--rest:#ffa94d;--prep:#ffd43b;--done:#69db7c;--accent:var(--work)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;border:0;cursor:pointer;color:var(--text);background:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
/* 動画エリア（画面幅いっぱい） */
.media{position:relative;width:100%;background:#000;flex:none}
.figwrap{position:relative;width:100%;aspect-ratio:16/9}
.figwrap>svg,.figwrap>video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.figwrap>video{display:none}
.ov{position:absolute;top:8px;left:8px;display:flex;gap:6px;align-items:center;pointer-events:none}
.pill{padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;background:rgba(0,0,0,.55);color:#fff}
.pill.ph{background:var(--accent);color:#101318}
#btnGear{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
#btnGear svg{width:22px;height:22px;fill:#fff}
.bar{height:6px;background:#2b333e}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
/* 情報エリア */
.info{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 16px;min-height:0;text-align:center}
.sec{font-size:min(30vw,150px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.name{font-size:26px;font-weight:800;margin-top:4px}
.next{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--sub);text-align:left}
.next b{color:var(--text);font-size:15px}
.nfw{position:relative;width:88px;aspect-ratio:16/9;flex:none;border-radius:6px;overflow:hidden;background:#000}
.nfw>svg,.nfw>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.nfw>video{display:none}
/* ボタン */
.side{display:contents}
.ctrl{display:flex;justify-content:center;align-items:center;gap:28px;padding:10px 0 18px;flex:none}
.ctrl button{display:grid;place-items:center;border-radius:50%}
.ctrl .s{width:60px;height:60px;background:#232a34}
.ctrl .m{width:84px;height:84px;background:var(--accent)}
.ctrl svg{width:28px;height:28px;fill:var(--text)}
.ctrl .m svg{width:38px;height:38px;fill:#101318}
.ctrl button:active{transform:scale(.95)}
/* 横向き：動画を画面いっぱいに */
@media (orientation:landscape) and (max-height:600px){
  #app{max-width:none;flex-direction:row}
  .media{flex:1;height:100%;display:flex;flex-direction:column}
  .figwrap{flex:1;aspect-ratio:auto}
  .side{width:190px;display:flex;flex-direction:column}
  .sec{font-size:72px}.name{font-size:18px}
  .next{flex-direction:column;text-align:center;margin-top:8px}
  .ctrl{gap:12px;padding:8px 0 12px}
  .ctrl .s{width:50px;height:50px}.ctrl .m{width:66px;height:66px}
}
/* 設定シート */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
.sheet.open{display:block}
.panel{position:absolute;inset:auto 0 0 0;max-height:88dvh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.ph2{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1;background:var(--card);padding:14px 0 10px}
.ph2 b{font-size:18px}
.ph2 button{font-size:16px;font-weight:700;color:var(--work);padding:6px 4px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.row select{font:inherit;font-size:16px;background:#2a313c;color:var(--text);border:0;border-radius:8px;padding:6px 8px}
.row input[type=checkbox]{width:22px;height:22px}
.total{color:var(--sub);font-size:13px;margin:10px 0;text-align:right}
h2{font-size:16px;margin:18px 0 6px}
ol.menu{list-style:none;margin:0;padding:0}
ol.menu li{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
ol.menu .no{flex:none;width:24px;height:24px;border-radius:50%;background:#2a313c;display:grid;place-items:center;font-weight:800;font-size:13px}
ol.menu b{display:block;font-size:15px}
ol.menu span{font-size:13px;color:var(--sub);line-height:1.5}
.exopt{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px;font-size:13px;color:var(--sub)}
.exopt label{display:flex;align-items:center;gap:6px}
.exopt select{font:inherit;font-size:15px;background:#2a313c;color:var(--text);border:0;border-radius:8px;padding:5px 6px}
.exopt .dim{opacity:.6}
.seg{display:flex;background:#12161c;border-radius:12px;padding:4px;gap:4px;margin:4px 0 6px}
.seg button{flex:1;padding:10px 4px;border-radius:9px;font-weight:800;font-size:15px;color:var(--sub)}
.seg button.on{background:var(--work);color:#101318}
.mchip{font-size:14px;font-weight:700;color:var(--sub);background:#1c222b;border-radius:999px;padding:5px 14px;margin-bottom:6px}
.ttl{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ed{display:flex;gap:4px}
.ed button{width:32px;height:30px;border-radius:8px;background:#2a313c;font-size:15px}
.ed button:disabled{opacity:.3}
.note{font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:14px}
</style>
</head>
<body>
<div id="app">
  <div class="media">
    <div class="figwrap"><svg id="fig" viewBox="0 0 200 112"></svg><video id="vid" muted loop playsinline preload="auto"></video></div>
    <div class="ov"><span class="pill" id="count">1/6</span><span class="pill ph" id="phase">スタート待ち</span></div>
    <button id="btnGear" aria-label="設定"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L14.9 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.4 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.9h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM12.9 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div class="side">
    <div class="info">
      <button class="mchip" id="mchip"></button>
      <div class="sec" id="sec">20</div>
      <div class="name" id="name"></div>
      <div class="next" id="nextBox"><div class="nfw"><svg id="nextFig" viewBox="0 0 200 112"></svg><video id="nvid" muted loop playsinline preload="auto"></video></div><div>NEXT<br><b id="nextName"></b></div></div>
    </div>
    <div class="ctrl">
      <button class="s" id="btnReset" aria-label="リセット"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      <button class="m" id="btnStart" aria-label="スタート"></button>
      <button class="s" id="btnSkip" aria-label="次へ"><svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM16 5h3v14h-3z"/></svg></button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="ph2"><b>設定</b><button id="btnClose">閉じる</button></div>
    <div class="seg" id="seg"><button data-m="abs">腹筋2分</button><button data-m="burn">脂肪燃焼2分</button><button data-m="custom">個別</button></div>
    <div class="row">全種目の時間をまとめて変更<select id="optWork"></select></div>
    <div class="row">全種目の休憩をまとめて変更<select id="optRest"></select></div>
    <div class="row">開始前の準備（秒）<select id="optPrep"><option>3</option><option selected>5</option><option>10</option></select></div>
    <div class="row">セット数<select id="optSets"><option selected>1</option><option>2</option><option>3</option></select></div>
    <div class="row">セット間の休憩（秒）<select id="optSetRest"><option>30</option><option selected>60</option><option>90</option></select></div>
    <div class="row">音声ガイド<input type="checkbox" id="optVoice" checked></div>
    <div class="row">ビープ音<input type="checkbox" id="optBeep" checked></div>
    <div class="total" id="total"></div>
    <h2>種目ごとの時間と休憩</h2>
    <ol class="menu" id="menu"></ol>
    <div class="row" id="addRow"><select id="addSel" style="width:100%"></select></div>
    <p class="note">設定はこのブラウザに保存されます。スマホを横向きにすると動画が大きく表示されます。<br>腰に痛みが出たら中止してください。レッグレイズ系で腰が浮く場合は、膝を曲げるか脚を高めの位置で止めると負担が減ります。</p>
  </div>
</div>
<p id="tip" hidden></p>

<script>
// ---- 種目データ（横から見た人体モデル。姿勢A⇔Bを往復） ----
// 角度は度（0=右, 90=下, -90=上）。手首・足首の位置を指定すると、肘・膝は腕や脚の長さを保ったまま自動で曲がる。
const SUP={hip:[100,91],torso:180,neck:180,face:-90,hand:[96,95.5],elbowHint:[0,-1],kneeHint:[-0.3,-1]};
const PROP={hip:[100,91],torso:206,neck:236,face:-30,hand:[78,95],elbowHint:[-1,1],kneeHint:[-0.3,-1]};
const ST={hip:[100,22],torso:-90,neck:-90,face:0,hand:[103,20],elbowHint:[-1,0],ankle:[100,94],foot:0,kneeHint:[1,0]};
const MC={hip:[100,58],torso:195,neck:200,face:100,hand:[52,96],elbowHint:[1,0],kneeHint:[-1,0.6],foot:72,foot2:72};
const RW={hip:[100,26],torso:-25,neck:-20,face:65,ankle:[94,94],kneeHint:[1,0],elbowHint:[-0.3,-1],foot:0};
const BP1={hip:[82,62],torso:-20,neck:-10,face:60,hand:[132,95],elbowHint:[0,-1],ankle:[100,94],foot:0,kneeHint:[1,-0.5]};
const BP2={hip:[83,56],torso:-12,neck:-12,face:80,hand:[132,95],elbowHint:[0,-1],ankle:[18,88],foot:110,kneeHint:[0,1]};
// 種目ライブラリ（cat: abs=腹筋 / burn=脂肪燃焼。scale は立ち姿勢を画面に収める縮小率、K は3コマ以上の動き）
const LIB = {
 plank:{name:"プランク・ヒップアップ", tip:"ひじとつま先で体を支え、お尻を上げ下げする。下げたときに腰を反らさない。", sp:0.7,
  A:{hip:[101,75],torso:189,neck:192,face:100,hand:[25,95],elbowHint:[1,1],ankle:[171,89],foot:72,kneeHint:[0,1]},
  B:{hip:[103,50],torso:162,neck:178,face:95,hand:[25,95],elbowHint:[1,1],ankle:[166,88],foot:66,kneeHint:[0,1]}},
 revcrunch:{name:"リバースクランチ", tip:"仰向けで脚を天井に向け、お尻を少し浮かせて足を真上へ突き上げる。反動を使わない。", sp:0.8,
  A:{...SUP,ankle:[104,19],foot:-5},
  B:{...SUP,hip:[97,80],torso:168,neck:175,face:-85,ankle:[92,8],foot:-12}},
 bicycle:{name:"バイシクルクランチ", tip:"手を頭の後ろに。自転車をこぐように膝を交互に胸へ引き寄せ、反対側のひじを近づける。", sp:0.75,
  A:{...SUP,torso:200,neck:212,face:-58,hand:[30,70],elbowHint:[0.4,-1],ankle:[118,66],foot:20,ankle2:[166,70],foot2:-5},
  B:{...SUP,torso:198,neck:210,face:-60,hand:[30,70],elbowHint:[0.4,-1],ankle:[166,70],foot:-5,ankle2:[118,66],foot2:20}},
 legraise:{name:"レッグレイズ", video:"video/4.mp4", tip:"仰向けで両脚をそろえて上げ下げ。腰が浮くなら膝を少し曲げてもOK。下げきらずに止める。", sp:0.45,
  A:{...SUP,ankle:[111,19.5],foot:-75},
  B:{...SUP,ankle:[170,80],foot:-5}},
 kneein:{name:"ニーイン・ニーアウト", tip:"ひじをついて上体を起こし、膝を胸に引き寄せてから脚を伸ばす。足は床につけない。", sp:0.7,
  A:{...PROP,ankle:[120,70],foot:25},
  B:{...PROP,ankle:[168,74],foot:-5}},
 leghold:{name:"レッグホールド", tip:"ひじをついて上体を起こし、脚を伸ばして床から少し浮かせたままキープ。息は止めない。", sp:0.5,
  A:{...PROP,ankle:[168,73],foot:-8},
  B:{...PROP,torso:205,ankle:[168,76],foot:-6}},
 squat:{name:"スクワット", tip:"足を肩幅に開き、お尻を後ろに引いて太ももが床と平行近くまで下げる。膝はつま先と同じ向きに。", sp:0.45, scale:.6,
  A:{...ST,hand:[148,-26],elbowHint:[0,1]}, B:{...ST,hip:[78,50],torso:-50,neck:-60,face:20,hand:[157,10],elbowHint:[0,1]}},
 stepjack:{name:"ステップジャック", tip:"跳ばずに、左右交互に足を横へ一歩出しながら両手を頭の上へ。リズムよく続ける。", sp:0.9, scale:.6,
  A:{...ST}, B:{...ST,hand:[96,-76],elbowHint:[1,0],ankle:[114,94],ankle2:[86,94]}},
 lunge:{name:"リバースランジ", tip:"片足を大きく後ろへ引いて沈み、前足で床を押して戻る。左右交互に。前の膝を前に出しすぎない。", sp:0.45, scale:.6,
  A:{...ST,hand:[110,22]}, B:{...ST,hip:[94,48],torso:-88,neck:-88,hand:[104,48],ankle:[120,94],ankle2:[54,90],foot2:35,knee2Hint:[0,1]}},
 climber:{name:"マウンテンクライマー", tip:"腕立ての姿勢で、膝を交互に胸へ引き寄せる。お尻を上げすぎない。ゆっくりでOK。", sp:1.0,
  A:{...MC,ankle:[104,84],ankle2:[168,90]}, B:{...MC,ankle:[168,90],ankle2:[104,84]}},
 row:{name:"ダンベルロウ", tip:"膝を軽く曲げて上体を前に倒し、ダンベルをおへそに向けて引き上げる。背中を丸めない。", sp:0.6, scale:.6, db:true,
  A:{...RW,hand:[146,53]}, B:{...RW,hand:[128,18]}},
 burpee:{name:"スロー・バーピー", tip:"しゃがんで手を床につく → 足を後ろへ伸ばす → 戻して立つ。跳ばずにゆっくり行う。", sp:0.3, scale:.6,
  K:[{...ST},BP1,BP2,BP1]},
};
const MENUS={abs:{name:"腹筋2分",ids:["plank","revcrunch","bicycle","legraise","kneein","leghold"]},
 burn:{name:"脂肪燃焼2分",ids:["squat","stepjack","lunge","climber","row","burpee"]},
 custom:{name:"個別",ids:["squat","plank","climber","legraise"]}};
const ABS_IDS=MENUS.abs.ids, BURN_IDS=MENUS.burn.ids;
let menuKey="abs";
let lists={};for(const k in MENUS)lists[k]=MENUS[k].ids.map(id=>({id,work:20,rest:0}));
let EX=[];

// ---- 人体モデル描画 ----
const NS="http://www.w3.org/2000/svg";
const LEN={torso:50,upper:25,fore:24,thigh:37,shin:35,neck:7,head:9.5,shoe:13};
const COL={skin:"#f0c4a0",skinD:"#d9a882",shirt:"#2b2f37",shirtD:"#1d2026",pants:"#3e5687",pantsD:"#2c3e64",shoe:"#f4f4f4",shoeD:"#c9cdd3",sole:"#8a8f98",hair:"#2a221d"};
const rad=d=>d*Math.PI/180;
const ptA=(p,a,l)=>[p[0]+Math.cos(rad(a))*l,p[1]+Math.sin(rad(a))*l];
// 2関節の逆運動学：base から target へ、長さ l1,l2。hint 方向に関節を曲げる
function ik(base,target,l1,l2,hint){
  const dx=target[0]-base[0],dy=target[1]-base[1];
  const d=Math.min(Math.hypot(dx,dy),l1+l2-0.01),d2=Math.max(d,Math.abs(l1-l2)+0.01);
  const th=Math.atan2(dy,dx),a=Math.acos(Math.min(1,Math.max(-1,(l1*l1+d2*d2-l2*l2)/(2*l1*d2))));
  const c1=[base[0]+Math.cos(th+a)*l1,base[1]+Math.sin(th+a)*l1],c2=[base[0]+Math.cos(th-a)*l1,base[1]+Math.sin(th-a)*l1];
  const m=[base[0]+Math.cos(th)*l1*Math.cos(a),base[1]+Math.sin(th)*l1*Math.cos(a)];
  const s=c=>(c[0]-m[0])*hint[0]+(c[1]-m[1])*hint[1];
  const j=s(c1)>=s(c2)?c1:c2;
  const ja=Math.atan2(target[1]-j[1],target[0]-j[0]);
  return [j,[j[0]+Math.cos(ja)*l2,j[1]+Math.sin(ja)*l2]];
}
function buildFig(svg,small){
  svg.innerHTML="";
  const uid="g"+Math.random().toString(36).slice(2,7);
  svg.insertAdjacentHTML("beforeend",`
   <defs>
    <linearGradient id="${uid}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f2"/><stop offset="1" stop-color="#d9dde2"/></linearGradient>
    <linearGradient id="${uid}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6a4a"/><stop offset="1" stop-color="#6b5038"/></linearGradient>
    <radialGradient id="${uid}s"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
   </defs>
   <rect width="200" height="112" fill="url(#${uid}w)"/>
   <rect y="100" width="200" height="12" fill="url(#${uid}f)"/>
   <rect x="8" y="98.5" width="184" height="4.5" rx="2.2" fill="#6c66d1"/>
   <rect x="8" y="98.5" width="184" height="1.4" rx=".7" fill="#8f8ae3"/>`);
  const g=document.createElementNS(NS,"g");svg.appendChild(g);
  const mk=(tag,attrs)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);g.appendChild(e);return e};
  const seg=(c,w)=>mk("line",{stroke:c,"stroke-width":w,"stroke-linecap":"round"});
  const f={};
  f.shadow=mk("ellipse",{fill:`url(#${uid}s)`,ry:3});
  // 奥側（暗め）
  f.arm2u=seg(COL.shirtD,9);f.arm2f=seg(COL.skinD,7);f.hand2=mk("circle",{r:3.6,fill:COL.skinD});
  f.leg2t=seg(COL.pantsD,12.5);f.leg2s=seg(COL.pantsD,10);f.shoe2=seg(COL.shoeD,7.5);f.sole2=seg(COL.sole,2.2);
  // 胴体
  f.pelvis=mk("circle",{r:8,fill:COL.pants});
  f.torso=seg(COL.shirt,17);f.chest=seg(COL.shirt,15);
  f.neck=seg(COL.skin,6.5);
  f.head=mk("circle",{r:LEN.head,fill:COL.skin});
  f.hair=mk("path",{fill:COL.hair});
  f.ear=mk("circle",{r:1.8,fill:COL.skinD});
  // 手前側
  f.leg1t=seg(COL.pants,13);f.leg1s=seg(COL.pants,10.5);f.shoe1=seg(COL.shoe,7.5);f.sole1=seg(COL.sole,2.2);
  f.arm1u=seg(COL.shirt,9.5);f.arm1f=seg(COL.skin,7);f.hand1=mk("circle",{r:3.8,fill:COL.skin});
  f.db=mk("g",{});f.db.innerHTML=`<rect x="-7" y="-1.6" width="14" height="3.2" rx="1" fill="#555"/><rect x="-8" y="-5" width="4" height="10" rx="1.5" fill="#333"/><rect x="4" y="-5" width="4" height="10" rx="1.5" fill="#333"/>`;
  f.g=g;
  return f;
}
const L2=(e,a,b)=>{e.setAttribute("x1",a[0].toFixed(1));e.setAttribute("y1",a[1].toFixed(1));e.setAttribute("x2",b[0].toFixed(1));e.setAttribute("y2",b[1].toFixed(1))};
const lerpN=(a,b,t)=>a+(b-a)*t, lerpP=(a,b,t)=>[lerpN(a[0],b[0],t),lerpN(a[1],b[1],t)];
function mixPose(A,B,t){
  const P={};
  const base=k=>k.replace("2","");
  for(const k of new Set([...Object.keys(A),...Object.keys(B)])){
    const a=A[k]??A[base(k)]??B[k],b=B[k]??B[base(k)]??a;
    P[k]=Array.isArray(a)?lerpP(a,b,t):typeof a==="number"?lerpN(a,b,t):a}
  // 足首は腰を中心に「角度と距離」で補間（脚が弧を描いて自然に動く）
  for(const k of ["ankle","ankle2"]){
    const a=A[k]||A.ankle,b=B[k]||B.ankle;if(!a)continue;
    const pa=[a[0]-A.hip[0],a[1]-A.hip[1]],pb=[b[0]-(B.hip||A.hip)[0],b[1]-(B.hip||A.hip)[1]];
    let aa=Math.atan2(pa[1],pa[0]),ab=Math.atan2(pb[1],pb[0]);if(ab-aa>Math.PI)ab-=2*Math.PI;if(aa-ab>Math.PI)ab+=2*Math.PI;
    const an=lerpN(aa,ab,t),d=lerpN(Math.hypot(...pa),Math.hypot(...pb),t);
    P[k]=[P.hip[0]+Math.cos(an)*d,P.hip[1]+Math.sin(an)*d];
  }
  return P;
}
function poseOf(ex,t){
  if(!ex.K)return mixPose(ex.A,ex.B,t);
  const n=ex.K.length,x=((t%1)+1)%1*n,i=Math.floor(x),l=(1-Math.cos((x-i)*Math.PI))/2;
  return mixPose(ex.K[i],ex.K[(i+1)%n],l);
}
function drawFig(f,ex,t){
  const P=poseOf(ex,t);
  f.g.setAttribute("transform",ex.scale?`translate(100 100) scale(${ex.scale}) translate(-100 -100)`:"");
  const hip=P.hip, sh=ptA(hip,P.torso,LEN.torso), mid=lerpP(hip,sh,.45);
  const nk=ptA(sh,P.neck,LEN.neck), hc=ptA(nk,P.neck,LEN.head+1);
  // 腕
  const [el1,ha1]=ik(sh,P.hand,LEN.upper,LEN.fore,P.elbowHint);
  const off=[2.2,-1.6];
  const sh2=[sh[0]+off[0],sh[1]+off[1]],hip2=[hip[0]+off[0],hip[1]+off[1]];
  const hT2=P.hand2||P.hand;
  const [el2,ha2]=ik(sh2,[hT2[0]+off[0],hT2[1]+off[1]],LEN.upper,LEN.fore,P.elbow2Hint||P.elbowHint);
  // 脚
  const [kn1,an1]=ik(hip,P.ankle,LEN.thigh,LEN.shin,P.kneeHint);
  const aT2=P.ankle2||P.ankle;
  const [kn2,an2]=ik(hip2,[aT2[0]+off[0],aT2[1]+off[1]],LEN.thigh,LEN.shin,P.knee2Hint||P.kneeHint);
  const ft1=ptA(an1,P.foot,LEN.shoe), ft2=ptA(an2,P.foot2??P.foot,LEN.shoe);
  const soleOff=(a,ang,d)=>ptA(a,ang+90,d);
  // 影
  const xs=[hip[0],sh[0],an1[0],hc[0]];const minx=Math.min(...xs),maxx=Math.max(...xs);
  f.shadow.setAttribute("cx",((minx+maxx)/2).toFixed(1));f.shadow.setAttribute("cy","100.5");f.shadow.setAttribute("rx",((maxx-minx)/2+12).toFixed(1));
  L2(f.arm2u,sh2,el2);L2(f.arm2f,el2,ha2);f.hand2.setAttribute("cx",ha2[0]);f.hand2.setAttribute("cy",ha2[1]);
  L2(f.leg2t,hip2,kn2);L2(f.leg2s,kn2,an2);L2(f.shoe2,an2,ft2);
  const fa2=P.foot2??P.foot;L2(f.sole2,soleOff(an2,fa2,3.6),soleOff(ft2,fa2,3.6));
  f.pelvis.setAttribute("cx",hip[0]);f.pelvis.setAttribute("cy",hip[1]);
  L2(f.torso,hip,mid);L2(f.chest,mid,sh);
  L2(f.neck,sh,nk);
  f.head.setAttribute("cx",hc[0]);f.head.setAttribute("cy",hc[1]);
  // 髪：顔の反対側を覆う半円＋頭頂
  const r=LEN.head+0.6,hb=P.face+180, a1=rad(hb-100),a2=rad(hb+100);
  f.hair.setAttribute("d",`M${(hc[0]+Math.cos(a1)*r).toFixed(1)},${(hc[1]+Math.sin(a1)*r).toFixed(1)} A${r},${r} 0 1 1 ${(hc[0]+Math.cos(a2)*r).toFixed(1)},${(hc[1]+Math.sin(a2)*r).toFixed(1)} Z`);
  const ea=ptA(hc,hb,2.5);f.ear.setAttribute("cx",ea[0]);f.ear.setAttribute("cy",ea[1]);
  L2(f.leg1t,hip,kn1);L2(f.leg1s,kn1,an1);L2(f.shoe1,an1,ft1);L2(f.sole1,soleOff(an1,P.foot,3.6),soleOff(ft1,P.foot,3.6));
  L2(f.arm1u,sh,el1);L2(f.arm1f,el1,ha1);f.hand1.setAttribute("cx",ha1[0]);f.hand1.setAttribute("cy",ha1[1]);
  f.db.style.display=ex.db?"":"none";if(ex.db)f.db.setAttribute("transform",`translate(${ha1[0].toFixed(1)} ${ha1[1].toFixed(1)})`);
}

// ---- 設定 ----
const $=id=>document.getElementById(id);
let per=[];
function applyMenu(){per=lists[menuKey];EX=per.map(it=>LIB[it.id]);}
const optIds=["optPrep","optSets","optSetRest","optVoice","optBeep"];
function loadOpts(){try{const o=JSON.parse(localStorage.getItem("abs2min")||"{}");if(Array.isArray(o.per)&&o.per.length===6)lists.abs=o.per.map((x,i)=>({id:ABS_IDS[i],work:+x.work||20,rest:+x.rest||0}));
if(o.lists)for(const k in MENUS){const l=o.lists[k];if(Array.isArray(l)&&l.length&&l.every(x=>LIB[x.id]))lists[k]=l.map(x=>({id:x.id,work:+x.work||20,rest:+x.rest||0}))}
if(MENUS[o.menu])menuKey=o.menu;optIds.forEach(id=>{if(o[id]!==undefined){const el=$(id);el.type==="checkbox"?el.checked=o[id]:el.value=o[id]}})}catch(e){}}
function saveOpts(){try{const o={};optIds.forEach(id=>{const el=$(id);o[id]=el.type==="checkbox"?el.checked:el.value});o.lists=lists;o.menu=menuKey;localStorage.setItem("abs2min",JSON.stringify(o))}catch(e){}}
const opt=()=>({prep:+$("optPrep").value,sets:+$("optSets").value,setRest:+$("optSetRest").value,voice:$("optVoice").checked,beep:$("optBeep").checked});

// ---- フェーズ構築 ----
let phases=[],idx=0,running=false,endAt=0,remain=0,finished=false;
function build(){
  const o=opt(); phases=[{type:"prep",dur:o.prep,ex:0,set:1}];
  for(let s=1;s<=o.sets;s++){
    EX.forEach((e,i)=>{
      phases.push({type:"work",dur:per[i].work,ex:i,set:s});
      const last=i===EX.length-1;
      if(!last&&per[i].rest>0)phases.push({type:"rest",dur:per[i].rest,ex:i+1,set:s});
      if(last&&s<o.sets)phases.push({type:"rest",dur:o.setRest,ex:0,set:s+1,setBreak:true});
    });
  }
  idx=0;remain=phases[0].dur;finished=false;running=false;
  const total=phases.reduce((a,p)=>a+p.dur,0)-o.prep;
  $("total").textContent=`合計 約${Math.floor(total/60)}分${total%60?total%60+"秒":""}（${o.sets}セット）`;
  render(true);
}

// ---- 音 ----
let ac=null;
function beep(freq=880,len=.12,vol=.25){
  if(!opt().beep)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.type="sine";
    g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+len);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+len)}catch(e){}
}
function say(text){
  if(!opt().voice||!("speechSynthesis" in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=1.05;speechSynthesis.speak(u)}catch(e){}
}
let wake=null;
async function keepAwake(on){try{if(on&&"wakeLock" in navigator){wake=await navigator.wakeLock.request("screen")}else if(wake){await wake.release();wake=null}}catch(e){}}

// ---- 進行 ----
function announce(){
  const p=phases[idx],o=opt(),ex=EX[p.ex];
  if(p.type==="prep")say(`準備してください。最初は${ex.name}`);
  else if(p.type==="work")say(o.sets>1&&p.ex===0?`${p.set}セット目。${ex.name}、スタート`:`${ex.name}、スタート`);
  else say(p.setBreak?`休憩。次は${p.set}セット目`:`休憩。次は${ex.name}`);
}
function nextPhase(){
  idx++;
  if(idx>=phases.length){finish();return}
  remain=phases[idx].dur;endAt=performance.now()+remain*1000;
  beep(phases[idx].type==="work"?1320:660,.35,.3);
  announce();render(true);
}
function finish(){
  running=false;finished=true;idx=phases.length-1;remain=0;
  beep(1320,.2);setTimeout(()=>beep(1760,.4),220);
  say("お疲れさまでした");keepAwake(false);render(true);
}
let lastShown=-1;
function tick(now){
  if(running){
    const left=Math.max(0,(endAt-now)/1000);
    remain=left;
    const s=Math.ceil(left);
    if(s!==lastShown){lastShown=s;if(s<=3&&s>0)beep(880,.12)}
    if(left<=0)nextPhase();
    render(false);
  }
  animate(now);
  requestAnimationFrame(tick);
}

// ---- 表示 ----
const fig=buildFig($("fig")),nfig=buildFig($("nextFig"));
function curEx(){return EX[phases[idx]?.ex??0]}
function animate(now){
  const p=phases[idx];const ex=curEx();
  const moving=running&&p&&p.type==="work";
  const t=!moving?0:ex.K?now/1000*ex.sp:(1-Math.cos(now/1000*Math.PI*ex.sp))/2;
  drawFig(fig,ex,t);
}
function render(full){
  const p=phases[idx];if(!p)return;
  const ex=EX[p.ex],o=opt();
  const color=finished?"var(--done)":p.type==="work"?"var(--work)":p.type==="rest"?"var(--rest)":"var(--prep)";
  document.documentElement.style.setProperty("--accent",color);
  const s=Math.ceil(remain);
  $("sec").textContent=String(s).padStart(2,"0");
  $("bar").style.width=(finished?100:(1-remain/p.dur)*100)+"%";
  if(!full)return;
  $("count").textContent=`${p.ex+1}/${EX.length}`;
  $("phase").textContent=finished?"完了":!running&&idx===0&&remain===p.dur?"スタート待ち":!running?"一時停止":p.type==="work"?(o.sets>1?`${p.set}セット目`:"運動中"):p.type==="rest"?"休憩":"準備";
  $("name").textContent=finished?"お疲れさまでした！":ex.name;
  $("tip").textContent=finished?"もう一度やるときは「もう一度」を押してください。":ex.tip;
  // NEXT
  // 準備・休憩中は画面の種目が「これから行う種目」なので、その次をNEXTに出す
  let skip=p.type==="work"?0:1,nx=null;
  for(let j=idx+1;j<phases.length;j++){if(phases[j].type==="work"){if(skip){skip--;continue}nx=phases[j];break}}
  if(finished||!nx){$("nextBox").style.display="none"}else{$("nextBox").style.display="";$("nextName").textContent=EX[nx.ex].name;drawFig(nfig,EX[nx.ex],.5)}
  showMedia($("fig"),$("vid"),finished?EX[EX.length-1]:ex,running&&p.type==="work"&&!finished);
  if(nx)showMedia($("nextFig"),$("nvid"),EX[nx.ex],true);
  $("btnStart").innerHTML=finished?'<svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>':running?'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
  // menu
  [...$("menu").children].forEach((li,i)=>{
    li.className=finished?"fin":(p.type==="work"&&i===p.ex?"now":(i<p.ex||(p.type!=="work"&&i<p.ex))?"fin":"");
  });
}
// 実写動画がある種目は動画、無い種目は人体モデルを表示
function showMedia(svg,vid,ex,play){
  if(ex.video){
    svg.style.display="none";vid.style.display="block";
    if(vid.getAttribute("src")!==ex.video){vid.setAttribute("src",ex.video);vid.load()}
    if(play){const r=vid.play();if(r&&r.catch)r.catch(()=>{})}else vid.pause();
  }else{svg.style.display="block";vid.style.display="none";vid.pause()}
}
const WORK_OPTS=[10,15,20,25,30,40,45,60,90],REST_OPTS=[0,5,10,15,20,30,45,60];
const optHtml=(list,v,zero)=>list.map(x=>`<option value="${x}"${x===v?" selected":""}>${x===0&&zero?zero:x+"秒"}</option>`).join("");
function syncBulk(){
  const same=k=>per.every(x=>x[k]===per[0][k])?per[0][k]:null;
  const w=same("work"),r=same("rest");
  $("optWork").innerHTML=(w===null?'<option value="" selected>個別</option>':"")+optHtml(WORK_OPTS,w);
  $("optRest").innerHTML=(r===null?'<option value="" selected>個別</option>':"")+optHtml(REST_OPTS,r,"なし");
}
function menuInit(){
  applyMenu();
  const cus=menuKey==="custom";
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.m===menuKey));
  $("mchip").textContent=MENUS[menuKey].name+" ▾";
  $("addRow").style.display=cus?"":"none";
  $("menu").innerHTML=EX.map((e,i)=>{
    const last=i===EX.length-1;
    const ed=cus?`<div class="ed"><button data-act="up" data-i="${i}"${i===0?" disabled":""}>↑</button><button data-act="down" data-i="${i}"${last?" disabled":""}>↓</button><button data-act="del" data-i="${i}"${EX.length<2?" disabled":""}>✕</button></div>`:"";
    return `<li><div class="no">${i+1}</div><div style="flex:1"><div class="ttl"><b>${e.name}</b>${ed}</div><span>${e.tip}</span>
      <div class="exopt"><label>時間<select data-i="${i}" data-k="work">${optHtml(WORK_OPTS,per[i].work)}</select></label>
      ${last?'<label class="dim">最後の種目</label>':`<label>このあと休憩<select data-i="${i}" data-k="rest">${optHtml(REST_OPTS,per[i].rest,"なし")}</select></label>`}</div></div></li>`}).join("");
  syncBulk();
}

// ---- ボタン ----
$("btnStart").onclick=()=>{
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  if(finished){build()}
  if(running){running=false;remain=Math.max(0,(endAt-performance.now())/1000);keepAwake(false);speechSynthesis&&speechSynthesis.cancel();render(true);return}
  const fresh=idx===0&&remain===phases[0].dur;
  running=true;endAt=performance.now()+remain*1000;lastShown=-1;keepAwake(true);
  if(fresh)announce();
  render(true);
};
$("btnSkip").onclick=()=>{if(finished)return;if(!running){idx++;if(idx>=phases.length){finish();return}remain=phases[idx].dur;render(true)}else{endAt=performance.now()}};
$("btnReset").onclick=()=>{running=false;keepAwake(false);try{speechSynthesis.cancel()}catch(e){}build()};
const applyOpts=()=>{saveOpts();if(!running)build()};
optIds.forEach(id=>$(id).addEventListener("change",applyOpts));
$("optWork").addEventListener("change",e=>{if(e.target.value==="")return;per.forEach(x=>x.work=+e.target.value);menuInit();applyOpts()});
$("optRest").addEventListener("change",e=>{if(e.target.value==="")return;per.forEach(x=>x.rest=+e.target.value);menuInit();applyOpts()});
$("menu").addEventListener("change",e=>{const el=e.target;if(!el.dataset.k)return;per[+el.dataset.i][el.dataset.k]=+el.value;syncBulk();applyOpts()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&running)keepAwake(true)});

// メニュー切替・個別メニューの編集
const libOpts=(ids,label)=>`<optgroup label="${label}">${ids.map(id=>`<option value="${id}">${LIB[id].name}</option>`).join("")}</optgroup>`;
$("addSel").innerHTML='<option value="">＋ 種目を追加…</option>'+libOpts(ABS_IDS,"腹筋")+libOpts(BURN_IDS,"脂肪燃焼");
function stopAll(){running=false;keepAwake(false);try{speechSynthesis.cancel()}catch(e){}}
$("seg").onclick=e=>{const m=e.target.dataset.m;if(!m||m===menuKey)return;stopAll();menuKey=m;menuInit();saveOpts();build()};
$("addSel").onchange=e=>{const id=e.target.value;if(!id)return;lists.custom.push({id,work:20,rest:0});e.target.value="";stopAll();menuInit();saveOpts();build()};
$("menu").addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b)return;const i=+b.dataset.i,l=lists.custom;
  if(b.dataset.act==="up"&&i>0)[l[i-1],l[i]]=[l[i],l[i-1]];
  else if(b.dataset.act==="down"&&i<l.length-1)[l[i+1],l[i]]=[l[i],l[i+1]];
  else if(b.dataset.act==="del"&&l.length>1)l.splice(i,1);
  stopAll();menuInit();saveOpts();build()});
$("mchip").onclick=()=>$("sheet").classList.add("open");
$("btnGear").onclick=()=>$("sheet").classList.add("open");
$("btnClose").onclick=()=>$("sheet").classList.remove("open");
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").classList.remove("open")};
loadOpts();menuInit();build();requestAnimationFrame(tick);
</script>
</body>
</html>
